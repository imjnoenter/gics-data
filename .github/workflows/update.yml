name: Update GICS data

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC
  workflow_dispatch:        # allow manual "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas lxml requests

      - name: Scrape GICS data
        run: python scrape.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain gics.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add gics.json
            git commit -m "chore: weekly GICS refresh"
            git push
          else
            echo "gics.json unchanged — nothing to commit."
          fi
